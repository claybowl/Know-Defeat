steps:
  # Install dependencies
  - name: 'node:18'
    entrypoint: npm
    args: ['install', '--legacy-peer-deps']
    
  # Build the React app
  - name: 'node:18'
    entrypoint: npm 
    args: ['run', 'build']
    env:
      - 'NODE_OPTIONS=--legacy-peer-deps'
      - 'NODE_ENV=production'
    
  # Build and push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/know-defeat-ui:latest', '-f', 'Dockerfile.simple', '.']
    
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'know-defeat-ui'
      - '--image'
      - 'gcr.io/$PROJECT_ID/know-defeat-ui:latest'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '80'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/know-defeat-ui:latest'