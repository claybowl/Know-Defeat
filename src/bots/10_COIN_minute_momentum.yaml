name: COIN Short Minute Momentum
description: Minute-based momentum short strategy for Coinbase stock
version: 1.0

# Bot Identification (Persistent IDs)
bot_id: 10  # Permanent unique bot ID for database tracking
algo_id: 2  # Algorithm identifier
ticker: COIN
trade_direction: SHORT

# Trading Parameters
position_size: 2000.00  # Position size in USD
trailing_stop_pct: 0.002  # 0.2% trailing stop

# Algorithm Module (points to Python implementation)
algorithm_module: "algorithms.minute_momentum_algorithm"  # Python module with custom entry/exit logic

# Algorithm Parameters (passed to the algorithm module)
parameters:
  lookback_minutes: 5  # Compare current minute to price 5 minutes ago
  momentum_threshold: 0.003  # 0.3% minimum price decrease per minute
  confirmation_minutes: 2  # Confirm trend over the last 2 minutes
  use_volume: false  # Don't consider volume in decision making
  min_bars: 5  # Need at least 5 minute bars to make a decision
  max_spread_pct: 0.001  # Maximum bid-ask spread as percentage (0.1%) 