name: AAPL Short Minute Momentum
description: Minute-based momentum short strategy for Apple stock
version: 1.0

# Bot Identification (Persistent IDs)
bot_id: 16  # Permanent unique bot ID for database tracking
algo_id: 2  # Algorithm identifier
ticker: AAPL
trade_direction: SHORT

# Trading Parameters
position_size: 2000.00  # Position size in USD
trailing_stop_pct: 0.0015  # 0.15% trailing stop

# Algorithm Module (points to Python implementation)
algorithm_module: "algorithms.minute_momentum_algorithm"  # Python module with custom entry/exit logic

# Algorithm Parameters (passed to the algorithm module)
parameters:
  lookback_minutes: 3  # Compare current minute to price 3 minutes ago
  momentum_threshold: 0.0015  # 0.15% minimum price decrease per minute
  confirmation_minutes: 1  # Confirm trend over the last minute
  use_volume: true  # Consider volume in decision making
  min_bars: 3  # Need at least 3 minute bars to make a decision
  max_spread_pct: 0.0005  # Maximum bid-ask spread as percentage (0.05%) 