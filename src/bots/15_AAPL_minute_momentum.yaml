name: AAPL Long Minute Momentum
description: Minute-based momentum long strategy for Apple stock
version: 1.0

# Bot Identification (Persistent IDs)
bot_id: 15  # Permanent unique bot ID for database tracking
algo_id: 2  # Algorithm identifier
ticker: AAPL
trade_direction: LONG

# Trading Parameters
position_size: 2000.00  # Position size in USD
trailing_stop_pct: 0.0015  # 0.15% trailing stop

# Algorithm Module (points to Python implementation)
algorithm_module: "algorithms.minute_momentum_algorithm"  # Python module with custom entry/exit logic

# Algorithm Parameters (passed to the algorithm module)
parameters:
  lookback_minutes: 2  # Compare current minute to price 3 minutes ago
  momentum_threshold: 0.0015  # 0.15% minimum price increase per minute
  confirmation_minutes: 1  # Confirm trend over the last minute
  use_volume: false # Consider volume in decision making
  min_bars: 2  # Need at least 3 minute bars to make a decision
  # max_spread_pct: 0.0008  # Maximum bid-ask spread as percentage (0.05%) 